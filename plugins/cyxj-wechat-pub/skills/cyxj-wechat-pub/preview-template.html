<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公众号文章预览</title>
  <style>
    body {
      background: #F2F2F2;
      margin: 0;
      padding: 40px 0;
    }
    .phone-frame {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .phone-header {
      background: #EDEDED;
      padding: 12px 16px;
      font-size: 14px;
      color: #333;
      text-align: center;
      font-family: "PingFang SC", sans-serif;
      border-bottom: 1px solid #ddd;
    }
    #output {
      padding: 0;
    }
    /* Copy button */
    .copy-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid #eee;
      padding: 12px;
      text-align: center;
      z-index: 100;
    }
    .copy-btn {
      background: #1565C0;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 48px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: "PingFang SC", sans-serif;
    }
    .copy-btn:hover {
      background: #0D47A1;
    }
    .copy-btn.copied {
      background: #2E7D32;
    }
    /* 发布信息区：只在预览页显示，在 #output 之外，复制按钮抓不到 */
    .publish-info {
      max-width: 720px;
      margin: 32px auto 96px;
      padding: 20px;
      border: 2px dashed #1565C0;
      background: #F5F9FF;
      font-family: "PingFang SC", -apple-system, sans-serif;
      color: #222;
      font-size: 14px;
      line-height: 1.7;
    }
    .publish-info h3 { margin: 0 0 12px; font-size: 16px; }
    .publish-info p { margin: 0 0 8px; }
    .publish-info img { width: 100%; border: 1px solid #ccc; margin-bottom: 14px; display: block; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-header">公众号文章预览</div>
    <div id="output">
      {{CONTENT}}
    </div>
  </div>

  <!-- 发布信息区：微信后台单独填，不进正文；不在 #output 内，复制按钮抓不到 -->
  <div class="publish-info">
    <h3>📌 发布信息（微信后台单独填，不进正文）</h3>
    <p><b>标题：</b>{{TITLE}}</p>
    <p><b>摘要：</b>{{DIGEST}}</p>
    <p><b>封面 21:9（后台上传）：</b>{{COVER_21x9}}</p>
    <img src="{{COVER_21x9}}" alt="封面 21:9" onerror="this.style.display='none'">
    <p><b>封面 16:9 原图：</b>{{COVER_16x9}}</p>
    <img src="{{COVER_16x9}}" alt="封面 16:9" onerror="this.style.display='none'">
  </div>

  <div class="copy-bar">
    <button class="copy-btn" onclick="copyToClipboard()">复制到剪贴板</button>
  </div>

  <script>
    async function copyToClipboard() {
      const output = document.getElementById('output');
      const html = output.innerHTML;
      const btn = document.querySelector('.copy-btn');
      try {
        const blob = new Blob([html], { type: 'text/html' });
        await navigator.clipboard.write([
          new ClipboardItem({ 'text/html': blob })
        ]);
        btn.textContent = '已复制！';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '复制到剪贴板';
          btn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        // Fallback: select and copy
        const range = document.createRange();
        range.selectNodeContents(output);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges();
        btn.textContent = '已复制！';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '复制到剪贴板';
          btn.classList.remove('copied');
        }, 2000);
      }
    }
  </script>
</body>
</html>
